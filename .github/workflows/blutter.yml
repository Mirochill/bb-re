name: blutter
on: [push, workflow_dispatch]
jobs:
  re:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Run blutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip cmake ninja-build g++ git > /dev/null
          git clone --depth 1 https://github.com/worawit/blutter
          pip3 install -q requests
          mkdir -p libs/arm64-v8a
          mv libapp.so libs/arm64-v8a/libapp.so
          mv libflutter.so libs/arm64-v8a/libflutter.so
          python3 blutter/blutter.py libs/arm64-v8a out || python3 blutter/blutter.py libs out
      - uses: actions/upload-artifact@v4
        with:
          name: blutter-out
          path: out
