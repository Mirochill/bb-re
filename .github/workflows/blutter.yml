name: blutter
on: [push, workflow_dispatch]
jobs:
  re:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Run blutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip cmake ninja-build g++ git zip unzip > /dev/null
          git clone --depth 1 https://github.com/worawit/blutter
          pip3 install -q requests
          curl -sL -o app.apk "https://beggibeggi.com/download/beggi-beggi.apk?v=1781649421"
          mkdir -p libs/arm64-v8a out
          unzip -o -q app.apk "lib/arm64-v8a/*" -d apkx
          cp apkx/lib/arm64-v8a/libapp.so apkx/lib/arm64-v8a/libflutter.so libs/arm64-v8a/
          python3 blutter/blutter.py libs/arm64-v8a out
      - uses: actions/upload-artifact@v4
        with:
          name: blutter-out
          path: out
